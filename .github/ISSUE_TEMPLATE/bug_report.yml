name: Bug report
description: Reportar um comportamento incorreto no nfse-autoemit
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu
      description: Descreva o bug e o que você esperava que acontecesse em vez disso.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Rode 'nfse-autoemit ...'
        2. Navegue até '...'
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: SO, terminal/emulador, versão do nfse-autoemit (ou do Go, se compilado do source)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Cole aqui logs relevantes ou screenshots. Nunca cole chaves de API ou tokens.
    validations:
      required: false
